# GitOps loop: every minute Flux checks main, and applies deploy/k8s/overlays/prod when it changed.
# The repo is public: read-only HTTPS, no credentials in the cluster.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: jobbot
  namespace: flux-system
spec:
  url: https://github.com/chikamint/jobbot
  ref:
    branch: main
  interval: 1m
  ignore: |
    # fetch only the manifests, not app code / docs / infra
    /*
    !/deploy/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jobbot-prod
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: jobbot
  path: ./deploy/k8s/overlays/prod
  interval: 10m        # full re-apply every 10 min even without commits: reverts manual changes (drift)
  retryInterval: 2m
  timeout: 5m
  prune: true          # an object removed from git is removed from the cluster
  wait: true           # Ready only when the applied workloads are healthy

# Local Kubernetes cluster for development (kind = Kubernetes in Docker).
# Each node is a Docker container running kubelet + containerd.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jobbot
nodes:
  - role: control-plane
    extraPortMappings:           # node container ports -> host ports, for the Gateway later
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker

# Production: k3s on the AWS node. Image comes from GHCR, built and scanned by CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# base sets its own namespace, but objects added here (components) would otherwise land in "default"
namespace: jobbot
resources:
  - ../../base
components:
  - ../../components/monitoring   # ServiceMonitor, alerts, Grafana dashboard (needs `make prod-monitoring` first)
  - ../../components/backup       # daily pg_dump to S3 (needs `make infra-apply` first: bucket + node IAM role)
images:
  - name: jobbot
    newName: ghcr.io/chikamint/jobbot
    newTag: sha-62b52c4   # deployed version = git commit; bump to release

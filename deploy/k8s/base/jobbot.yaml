# jobbot: collects vacancies every hour, stores them in Postgres, posts new ones to Telegram.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobbot
spec:
  replicas: 1                      # 2 replicas would post every vacancy twice: this is a singleton worker
  strategy:
    type: Recreate                 # stop the old pod before starting the new one, never two at once
  selector:
    matchLabels:
      app: jobbot
  template:
    metadata:
      labels:
        app: jobbot
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: jobbot
          image: jobbot                    # tag is set per environment in overlays/
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
          env:                             # libpq standard variables, the app reads them as-is
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: TELEGRAM_BOT_TOKEN       # optional: without it the bot runs in dry-run mode
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: chat_id
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Service for metrics: Prometheus will scrape jobbot through it (day 5)
apiVersion: v1
kind: Service
metadata:
  name: jobbot
  labels:
    app: jobbot
spec:
  selector:
    app: jobbot
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics

# CI: test → validate manifests → build image → scan → push to GHCR (main only).
# Third-party actions are pinned to commit SHAs: a tag can be moved to malicious code, a SHA cannot.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:                       # a newer push cancels the older run on the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest==8.3.4
      - run: python -m pytest -q
        working-directory: app

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Kubernetes manifests against the API schema (incl. Prometheus Operator CRDs)
        env:
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "== $overlay"
            kubectl kustomize "$overlay" \
              | docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
                  -schema-location default -schema-location "$CRD_SCHEMAS" -
          done
      - name: Every namespaced object must land in "jobbot" (not silently in "default")
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            kubectl kustomize "$overlay" | python3 -c '
          import sys, yaml
          bad = [f"{d[\"kind\"]}/{d[\"metadata\"][\"name\"]}" for d in yaml.safe_load_all(sys.stdin)
                 if d["kind"] != "Namespace" and d["metadata"].get("namespace") != "jobbot"]
          sys.exit(f"outside namespace jobbot: {bad}" if bad else 0)'
          done
      - name: Unit-test alert rules (promtool)
        run: pip install pyyaml && make test-alerts

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate (no AWS credentials needed)
        run: |
          for stack in infra/terraform/bootstrap infra/terraform/prod; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done

  image:
    needs: [test, manifests, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # push to GHCR with the built-in GITHUB_TOKEN, no personal secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 — emulates ARM to build arm64 on x86 runners
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true     # fail only on vulnerabilities that already have a fix
          exit-code: "1"

      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64   # prod node is ARM (t4g), local kind is x86
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

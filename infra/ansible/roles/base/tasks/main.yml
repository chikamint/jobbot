- name: Upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades   # security patches install automatically every day
      - htop
    state: present

- name: Enable daily unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# 2 GiB RAM is tight for k3s + PostgreSQL: swap prevents OOM kills on short memory spikes
- name: Check swap file
  ansible.builtin.stat:
    path: /swapfile
  register: base_swapfile

- name: Create swap file
  when: not base_swapfile.stat.exists
  block:
    - name: Allocate 2 GiB
      ansible.builtin.command: fallocate -l 2G /swapfile
      changed_when: true

    - name: Restrict permissions (swap may contain secrets from memory)
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: Format as swap
      ansible.builtin.command: mkswap /swapfile
      changed_when: true

    - name: Enable swap now
      ansible.builtin.command: swapon /swapfile
      changed_when: true

- name: Enable swap on boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0

- name: Prefer RAM, use swap only under pressure
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-jobbot.conf
    content: |
      vm.swappiness = 10
    mode: "0644"
  notify: Apply sysctl

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Check if a reboot is required (new kernel)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Reboot to load the new kernel
  ansible.builtin.reboot:
  when: base_reboot_required.stat.exists
